  - action: homeassistant.save_persistent_states
script:
  lab_span_restore_supply:
    alias: Restore all circuit supplies (loads stay off)
    sequence:
    - condition: state
      entity_id: input_boolean.lab_span_grid_outage
      state: 'off'
    - action: input_boolean.turn_off
      target:
        entity_id:
        - input_boolean.lab_span_main_outage
        - input_boolean.lab_span_living_room_fault
        - input_boolean.lab_span_office_fault
        - input_boolean.lab_span_kitchen_fault
        - input_boolean.lab_span_essentials_fault
        - input_boolean.lab_span_laundry_fault
        - input_boolean.lab_span_garage_fault
        - input_boolean.lab_span_hvac_fault
        - input_boolean.lab_span_water_heater_fault
    - delay:
        seconds: 5
    - if:
      - condition: state
        entity_id: switch.span_panel_living_room_breaker
        state: 'off'
      then:
      - action: switch.turn_on
        target:
          entity_id: switch.span_panel_living_room_breaker
    - if:
      - condition: state
        entity_id: switch.span_panel_office_outlets_breaker
        state: 'off'
      then:
      - action: switch.turn_on
        target:
          entity_id: switch.span_panel_office_outlets_breaker
    - if:
      - condition: state
        entity_id: switch.span_panel_kitchen_outlets_breaker
        state: 'off'
      then:
      - action: switch.turn_on
        target:
          entity_id: switch.span_panel_kitchen_outlets_breaker
    - if:
      - condition: state
        entity_id: switch.span_panel_essential_electronics_breaker
        state: 'off'
      then:
      - action: switch.turn_on
        target:
          entity_id: switch.span_panel_essential_electronics_breaker
    - if:
      - condition: state
        entity_id: switch.span_panel_laundry_dryer_breaker
        state: 'off'
      then:
      - action: switch.turn_on
        target:
          entity_id: switch.span_panel_laundry_dryer_breaker
    - if:
      - condition: state
        entity_id: switch.span_panel_garage_ev_charger_breaker
        state: 'off'
      then:
      - action: switch.turn_on
        target:
          entity_id: switch.span_panel_garage_ev_charger_breaker
    - if:
      - condition: state
        entity_id: switch.span_panel_central_hvac_breaker
        state: 'off'
      then:
      - action: switch.turn_on
        target:
          entity_id: switch.span_panel_central_hvac_breaker
    - if:
      - condition: state
        entity_id: switch.span_panel_water_heater_breaker
        state: 'off'
      then:
      - action: switch.turn_on
        target:
          entity_id: switch.span_panel_water_heater_breaker
  lab_span_backup_restore:
    alias: Restore circuit within battery budget
    mode: queued
    max: 20
    fields:
      circuit:
        required: true
        selector:
          select:
            options:
            - living_room
            - office
            - kitchen
            - essentials
            - laundry
            - garage
            - hvac
            - water_heater
    sequence:
    - variables:
        peaks:
          living_room: 73
          office: 1516
          kitchen: 2553
          essentials: 500
          laundry: 5001
          garage: 5760
          hvac: 3008
          water_heater: 4502
        relays:
          living_room: switch.span_panel_living_room_breaker
          office: switch.span_panel_office_outlets_breaker
          kitchen: switch.span_panel_kitchen_outlets_breaker
          essentials: switch.span_panel_essential_electronics_breaker
          laundry: switch.span_panel_laundry_dryer_breaker
          garage: switch.span_panel_garage_ev_charger_breaker
          hvac: switch.span_panel_central_hvac_breaker
          water_heater: switch.span_panel_water_heater_breaker
        priorities:
          living_room: select.span_panel_living_room_circuit_priority
          office: select.span_panel_office_outlets_circuit_priority
          kitchen: select.span_panel_kitchen_outlets_circuit_priority
          essentials: select.span_panel_essential_electronics_circuit_priority
          laundry: select.span_panel_laundry_dryer_circuit_priority
          garage: select.span_panel_garage_ev_charger_circuit_priority
          hvac: select.span_panel_central_hvac_circuit_priority
          water_heater: select.span_panel_water_heater_circuit_priority
    - condition: template
      value_template: '{{ circuit in peaks }}'
    - if:
      - condition: template
        value_template: '{{ is_state(''input_boolean.lab_span_grid_outage'', ''on'')
          }}'
      then:
      - if:
        - condition: template
          value_template: '{{ not is_state(''binary_sensor.lab_span_backup_ready'',
            ''on'') or is_state(''input_boolean.lab_span_main_outage'', ''on'') or
            not is_state(''input_boolean.lab_span_'' ~ circuit ~ ''_fault'', ''off'')
            or (((73 if is_state(''input_boolean.lab_span_backup_living_room'', ''on'')
            else 0) + (1516 if is_state(''input_boolean.lab_span_backup_office'',
            ''on'') else 0) + (2553 if is_state(''input_boolean.lab_span_backup_kitchen'',
            ''on'') else 0) + (500 if is_state(''input_boolean.lab_span_backup_essentials'',
            ''on'') else 0) + (5001 if is_state(''input_boolean.lab_span_backup_laundry'',
            ''on'') else 0) + (5760 if is_state(''input_boolean.lab_span_backup_garage'',
            ''on'') else 0) + (3008 if is_state(''input_boolean.lab_span_backup_hvac'',
            ''on'') else 0) + (4502 if is_state(''input_boolean.lab_span_backup_water_heater'',
            ''on'') else 0)) + (0 if is_state(''input_boolean.lab_span_backup_'' ~
            circuit, ''on'') else peaks[circuit])) > 10500 }}'
        then:
        - action: persistent_notification.create
          data:
            title: Battery circuit restore blocked
            message: '{{ circuit ~ '': insufficient reserved capacity, battery unavailable,
              or an active fault. Turn another circuit off and try again. Budget:
              10,500 W; EV capped at 24 A.'' }}'
            notification_id: lab_span_backup_budget
        - action: switch.turn_off
          target:
            entity_id: '{{ relays[circuit] }}'
        - stop: Backup capacity or supply unavailable
      - action: input_boolean.turn_on
        target:
          entity_id: '{{ ''input_boolean.lab_span_backup_'' ~ circuit }}'
      - action: select.select_option
        target:
          entity_id: '{{ priorities[circuit] }}'
        data:
          option: never
    - action: switch.turn_on
      target:
        entity_id: '{{ relays[circuit] }}'
    - delay:
        seconds: 3
    - if:
      - condition: template
        value_template: '{{ not is_state(relays[circuit], ''on'') }}'
      then:
      - action: input_boolean.turn_off
        target:
          entity_id: '{{ ''input_boolean.lab_span_backup_'' ~ circuit }}'
      - action: persistent_notification.create
        data:
          title: Circuit did not restore
          message: The panel did not confirm closure. Try Restore on battery again.
          notification_id: lab_span_backup_budget
  lab_span_backup_restore_living_room:
    alias: Restore living room on battery
    sequence:
    - action: script.lab_span_backup_restore
      data:
        circuit: living_room
  lab_span_backup_restore_office:
    alias: Restore office on battery
    sequence:
    - action: script.lab_span_backup_restore
      data:
        circuit: office
  lab_span_backup_restore_kitchen:
    alias: Restore kitchen on battery
    sequence:
    - action: script.lab_span_backup_restore
      data:
        circuit: kitchen
  lab_span_backup_restore_essentials:
    alias: Restore essentials on battery
    sequence:
    - action: script.lab_span_backup_restore
      data:
        circuit: essentials
  lab_span_backup_restore_laundry:
    alias: Restore laundry on battery
    sequence:
    - action: script.lab_span_backup_restore
      data:
        circuit: laundry
  lab_span_backup_restore_garage:
    alias: Restore garage on battery
    sequence:
    - action: script.lab_span_backup_restore
      data:
        circuit: garage
  lab_span_backup_restore_hvac:
    alias: Restore hvac on battery
    sequence:
    - action: script.lab_span_backup_restore
      data:
        circuit: hvac
  lab_span_backup_restore_water_heater:
    alias: Restore water heater on battery
    sequence:
    - action: script.lab_span_backup_restore
      data:
        circuit: water_heater

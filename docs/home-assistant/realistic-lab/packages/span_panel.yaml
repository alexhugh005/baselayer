- id: lab_span_backup_overload
  alias: Backup measured overload disconnect
  mode: single
  triggers:
  - trigger: numeric_state
    entity_id: sensor.virtual_household_power
    above: 11000
  conditions:
  - condition: state
    entity_id: input_boolean.lab_span_grid_outage
    state: 'on'
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id:
      - input_boolean.lab_span_backup_living_room
      - input_boolean.lab_span_backup_office
      - input_boolean.lab_span_backup_kitchen
      - input_boolean.lab_span_backup_essentials
      - input_boolean.lab_span_backup_laundry
      - input_boolean.lab_span_backup_garage
      - input_boolean.lab_span_backup_hvac
      - input_boolean.lab_span_backup_water_heater
  - action: persistent_notification.create
    data:
      title: Backup overload stopped
      message: Measured load exceeded the 11 kW operating budget. Circuits were disconnected;
        restore a smaller selection.
      notification_id: lab_span_backup_budget
  - delay:
      seconds: 2.5
  - action: script.lab_span_command_relays
    data:
      entities:
      - switch.span_panel_living_room_breaker
      - switch.span_panel_office_outlets_breaker
      - switch.span_panel_kitchen_outlets_breaker
      - switch.span_panel_essential_electronics_breaker
      - switch.span_panel_laundry_dryer_breaker
      - switch.span_panel_garage_ev_charger_breaker
      - switch.span_panel_central_hvac_breaker
      - switch.span_panel_water_heater_breaker
      target_state: 'off'
script:
  lab_span_restore_supply:
    alias: Restore all circuit supplies (loads stay off)
    sequence:
    - condition: state
      entity_id: input_boolean.lab_span_grid_outage
      state: 'off'
    - action: input_boolean.turn_off
      target:
        entity_id:
        - input_boolean.lab_span_main_outage
        - input_boolean.lab_span_living_room_fault
        - input_boolean.lab_span_office_fault
        - input_boolean.lab_span_kitchen_fault
        - input_boolean.lab_span_essentials_fault
        - input_boolean.lab_span_laundry_fault
        - input_boolean.lab_span_garage_fault
        - input_boolean.lab_span_hvac_fault
        - input_boolean.lab_span_water_heater_fault
    - delay:
        seconds: 5
    - if:
      - condition: state
        entity_id: switch.span_panel_living_room_breaker
        state: 'off'
      then:
      - action: script.lab_span_command_relays
        data:
          entities: switch.span_panel_living_room_breaker
          target_state: 'on'
    - if:
      - condition: state
        entity_id: switch.span_panel_office_outlets_breaker
        state: 'off'
      then:
      - action: script.lab_span_command_relays
        data:
          entities: switch.span_panel_office_outlets_breaker
          target_state: 'on'
    - if:
      - condition: state
        entity_id: switch.span_panel_kitchen_outlets_breaker
        state: 'off'
      then:
      - action: script.lab_span_command_relays
        data:
          entities: switch.span_panel_kitchen_outlets_breaker
          target_state: 'on'
    - if:
      - condition: state
        entity_id: switch.span_panel_essential_electronics_breaker
        state: 'off'
      then:
      - action: script.lab_span_command_relays
        data:
          entities: switch.span_panel_essential_electronics_breaker
          target_state: 'on'
    - if:
      - condition: state
        entity_id: switch.span_panel_laundry_dryer_breaker
        state: 'off'
      then:
      - action: script.lab_span_command_relays
        data:
          entities: switch.span_panel_laundry_dryer_breaker
          target_state: 'on'
    - if:
      - condition: state
        entity_id: switch.span_panel_garage_ev_charger_breaker
        state: 'off'
      then:
      - action: script.lab_span_command_relays
        data:
          entities: switch.span_panel_garage_ev_charger_breaker
          target_state: 'on'
    - if:
      - condition: state
        entity_id: switch.span_panel_central_hvac_breaker
        state: 'off'
      then:
      - action: script.lab_span_command_relays
        data:
          entities: switch.span_panel_central_hvac_breaker
          target_state: 'on'
    - if:
      - condition: state
        entity_id: switch.span_panel_water_heater_breaker
        state: 'off'
      then:
      - action: script.lab_span_command_relays
        data:
          entities: switch.span_panel_water_heater_breaker
          target_state: 'on'
  lab_span_backup_restore:
    alias: Restore circuit within battery budget
    mode: queued
    max: 20
    fields:
      circuit:
        required: true
        selector:
          select:
            options:
            - living_room
            - office
            - kitchen
            - essentials
            - laundry
            - garage
            - hvac
            - water_heater
    sequence:
    - variables:
        peaks:
          living_room: 73
          office: 1516
          kitchen: 2553
          essentials: 500
          laundry: 5001
          garage: 5760
          hvac: 3008
          water_heater: 4502
        relays:
          living_room: switch.span_panel_living_room_breaker
          office: switch.span_panel_office_outlets_breaker
          kitchen: switch.span_panel_kitchen_outlets_breaker
          essentials: switch.span_panel_essential_electronics_breaker
          laundry: switch.span_panel_laundry_dryer_breaker
          garage: switch.span_panel_garage_ev_charger_breaker
          hvac: switch.span_panel_central_hvac_breaker
          water_heater: switch.span_panel_water_heater_breaker
    - condition: template
      value_template: '{{ circuit in peaks }}'
    - condition: state
      entity_id: input_boolean.lab_span_grid_outage
      state: 'on'
    - if:
      - condition: template
        value_template: '{{ is_state(''input_boolean.lab_span_grid_outage'', ''on'')
          }}'
      then:
      - if:
        - condition: template
          value_template: '{{ not is_state(''binary_sensor.lab_span_backup_ready'',
            ''on'') or is_state(''input_boolean.lab_span_main_outage'', ''on'') or
            not is_state(''input_boolean.lab_span_'' ~ circuit ~ ''_fault'', ''off'')
            or ((states(''sensor.virtual_household_power'') | float(99999)) + (0 if
            is_state(''input_boolean.lab_span_backup_'' ~ circuit, ''on'') else peaks[circuit]))
            > 11000 }}'
        then:
        - action: persistent_notification.create
          data:
            title: Battery circuit restore blocked
            message: '{{ circuit ~ '': measured load plus the startup estimate exceeds
              capacity, battery unavailable, or an active fault. Reduce load and try
              again. Budget: 11,000 W; EV capped at 24 A.'' }}'
            notification_id: lab_span_backup_budget
        - delay:
            seconds: 2.5
        - action: script.lab_span_command_relays
          data:
            entities: '{{ relays[circuit] }}'
            target_state: 'off'
        - stop: Backup capacity or supply unavailable
      - action: input_boolean.turn_on
        target:
          entity_id: '{{ ''input_boolean.lab_span_backup_'' ~ circuit }}'
    - delay:
        seconds: 2.5
    - condition: state
      entity_id: input_boolean.lab_span_grid_outage
      state: 'on'
    - if:
      - condition: template
        value_template: '{{ not is_state(relays[circuit], ''on'') }}'
      then:
      - action: script.lab_span_command_relays
        data:
          entities: '{{ relays[circuit] }}'
          target_state: 'on'
    - delay:
        seconds: 3
    - if:
      - condition: template
        value_template: '{{ not is_state(relays[circuit], ''on'') }}'
      then:
      - action: input_boolean.turn_off
        target:
          entity_id: '{{ ''input_boolean.lab_span_backup_'' ~ circuit }}'
      - action: persistent_notification.create
        data:
          title: Circuit did not restore
          message: The panel did not confirm closure. Try Restore on battery again.
          notification_id: lab_span_backup_budget
      - stop: Panel did not confirm closure
    - delay:
        seconds: 5
  lab_span_backup_restore_living_room:
    alias: Restore living room on battery
    sequence:
    - action: script.lab_span_backup_restore
      data:
        circuit: living_room
  lab_span_backup_restore_office:
    alias: Restore office on battery
    sequence:
    - action: script.lab_span_backup_restore
      data:
        circuit: office
  lab_span_backup_restore_kitchen:
    alias: Restore kitchen on battery
    sequence:
    - action: script.lab_span_backup_restore
      data:
        circuit: kitchen
  lab_span_backup_restore_essentials:
    alias: Restore essentials on battery
    sequence:
    - action: script.lab_span_backup_restore
      data:
        circuit: essentials
  lab_span_backup_restore_laundry:
    alias: Restore laundry on battery
    sequence:
    - action: script.lab_span_backup_restore
      data:
        circuit: laundry
  lab_span_backup_restore_garage:
    alias: Restore garage on battery
    sequence:
    - action: script.lab_span_backup_restore
      data:
        circuit: garage
  lab_span_backup_restore_hvac:
    alias: Restore hvac on battery
    sequence:
    - action: script.lab_span_backup_restore
      data:
        circuit: hvac
  lab_span_backup_restore_water_heater:
    alias: Restore water heater on battery
    sequence:
    - action: script.lab_span_backup_restore
      data:
        circuit: water_heater
  lab_span_command_relays:
    alias: Confirm virtual SPAN relay commands
    mode: queued
    max: 50
    sequence:
    - repeat:
        count: 3
        sequence:
        - variables:
            pending: '{{ expand(entities) | rejectattr(''state'', ''eq'', target_state)
              | map(attribute=''entity_id'') | list }}'
        - if:
          - condition: template
            value_template: '{{ pending | length > 0 }}'
          then:
          - delay:
              seconds: 2.5
          - action: '{{ ''switch.turn_'' ~ target_state }}'
            target:
              entity_id: '{{ pending }}'
            continue_on_error: true
          - delay:
              seconds: 1
    - if:
      - condition: template
        value_template: '{{ expand(entities) | rejectattr(''state'', ''eq'', target_state)
          | list | length > 0 }}'
      then:
      - action: persistent_notification.create
        data:
          title: Panel command not confirmed
          message: A virtual circuit did not reach its requested state. Check the
            panel connection and retry.
          notification_id: lab_span_relay_error

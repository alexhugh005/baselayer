  - choose:
    - conditions: '{{ (is_state(''input_boolean.lab_span_kitchen_fault'', ''on'')
        or is_state(''input_boolean.lab_span_main_outage'', ''on'')) and is_state(''switch.span_panel_kitchen_outlets_breaker'',
        ''on'') }}'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.span_panel_kitchen_outlets_breaker
    - conditions: '{{ not (is_state(''input_boolean.lab_span_kitchen_fault'', ''on'')
        or is_state(''input_boolean.lab_span_main_outage'', ''on'')) and trigger.id
        == ''command'' and is_state(''switch.span_panel_kitchen_outlets_breaker'',
        ''off'') }}'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.span_panel_kitchen_outlets_breaker
- id: lab_span_essentials_fault
  alias: Lab SPAN essentials fault relay
  mode: queued
  triggers:
  - trigger: state
    entity_id:
    - input_boolean.lab_span_essentials_fault
    - input_boolean.lab_span_main_outage
    to:
    - 'on'
    - 'off'
    id: command
  - trigger: state
    entity_id: switch.span_panel_essential_electronics_breaker
    to: 'on'
    id: enforce
  - trigger: time_pattern
    seconds: /10
    id: enforce
  - trigger: homeassistant
    event: start
    id: enforce
  actions:
  - delay:
      seconds: 4
  - choose:
    - conditions: '{{ (is_state(''input_boolean.lab_span_essentials_fault'', ''on'')
        or is_state(''input_boolean.lab_span_main_outage'', ''on'')) and is_state(''switch.span_panel_essential_electronics_breaker'',
        ''on'') }}'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.span_panel_essential_electronics_breaker
    - conditions: '{{ not (is_state(''input_boolean.lab_span_essentials_fault'', ''on'')
        or is_state(''input_boolean.lab_span_main_outage'', ''on'')) and trigger.id
        == ''command'' and is_state(''switch.span_panel_essential_electronics_breaker'',
        ''off'') }}'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.span_panel_essential_electronics_breaker
- id: lab_span_laundry_interlock
  alias: Lab SPAN laundry power interlock
  mode: restart
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.lab_span_laundry_supply
    - input_boolean.dryer_enabled
    - switch.virtual_dryer
  - trigger: homeassistant
    event: start
  - trigger: time_pattern
    seconds: /10

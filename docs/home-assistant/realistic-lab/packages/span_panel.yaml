input_boolean:
  lab_span_main_outage:
    name: Whole-house power outage
    icon: mdi:transmission-tower-off
  lab_span_living_room_fault:
    name: Living Room · Living Room fault
    icon: mdi:flash-alert
  lab_span_office_fault:
    name: Office · Office Outlets fault
    icon: mdi:flash-alert
  lab_span_kitchen_fault:
    name: Kitchen · Kitchen Outlets fault
    icon: mdi:flash-alert
  lab_span_essentials_fault:
    name: Utility · Essential Electronics fault
    icon: mdi:flash-alert
  lab_span_laundry_fault:
    name: Laundry · Laundry Dryer fault
    icon: mdi:flash-alert
  lab_span_garage_fault:
    name: Garage · Garage EV Charger fault
    icon: mdi:flash-alert
  lab_span_hvac_fault:
    name: Utility · Central HVAC fault
    icon: mdi:flash-alert
  lab_span_water_heater_fault:
    name: Utility · Water Heater fault
    icon: mdi:flash-alert
  lab_span_grid_outage:
    name: Grid outage · battery backup
    icon: mdi:transmission-tower-off
  lab_span_backup_living_room:
    name: Backup reservation living_room
    initial: false
  lab_span_backup_office:
    name: Backup reservation office
    initial: false
  lab_span_backup_kitchen:
    name: Backup reservation kitchen
    initial: false
  lab_span_backup_essentials:
    name: Backup reservation essentials
    initial: false
  lab_span_backup_laundry:
    name: Backup reservation laundry
    initial: false
  lab_span_backup_garage:
    name: Backup reservation garage
    initial: false
  lab_span_backup_hvac:
    name: Backup reservation hvac
    initial: false
  lab_span_backup_water_heater:
    name: Backup reservation water_heater
    initial: false
rest:
- resource: http://basehack-panelbench:18081/health
  scan_interval: 2
  binary_sensor:
  - name: Lab SPAN Bridge Connected
    unique_id: lab_span_bridge_connected
    device_class: connectivity
    value_template: '{{ value_json.connected }}'
  - name: Lab SPAN Backup Ready
    unique_id: lab_span_backup_ready
    value_template: '{{ value_json.connected and value_json.grid_online == false and
      value_json.battery is not none and value_json.battery.stored_energy_kwh > 0.001
      }}'
  sensor:
  - name: Lab SPAN Battery Charge
    unique_id: lab_span_battery_charge
    unit_of_measurement: '%'
    device_class: battery
    value_template: '{{ value_json.battery.soc_percent | round(3) }}'
    availability: '{{ value_json.connected and value_json.battery is not none }}'
  - name: Lab SPAN Battery Energy
    unique_id: lab_span_battery_energy
    unit_of_measurement: kWh
    device_class: energy
    value_template: '{{ value_json.battery.stored_energy_kwh }}'
    availability: '{{ value_json.connected and value_json.battery is not none }}'
  - name: Lab SPAN Battery Power
    unique_id: lab_span_battery_power
    unit_of_measurement: W
    device_class: power
    value_template: '{{ value_json.battery.discharge_watts | round(1) }}'
    availability: '{{ value_json.connected and value_json.battery is not none }}'
  - name: Lab SPAN Grid Power
    unique_id: lab_span_grid_power
    unit_of_measurement: W
    device_class: power
    value_template: '{{ value_json.grid_watts | round(1) }}'
    availability: '{{ value_json.connected }}'
template:
- binary_sensor:
  - name: Lab SPAN living_room Supply
    unique_id: lab_span_living_room_supply
    device_class: power
    state: '{{ is_state(''switch.span_panel_living_room_breaker'', ''on'') and is_state(''input_boolean.lab_span_living_room_fault'',
      ''off'') and is_state(''input_boolean.lab_span_main_outage'', ''off'') and is_state(''binary_sensor.lab_span_bridge_connected'',
      ''on'') and (is_state(''input_boolean.lab_span_grid_outage'', ''off'') or (is_state(''input_boolean.lab_span_grid_outage'',
      ''on'') and is_state(''input_boolean.lab_span_backup_living_room'', ''on'')
      and is_state(''binary_sensor.lab_span_backup_ready'', ''on'') and states(''sensor.lab_span_backup_reserved_power'')
      | float(99999) <= 10500)) }}'
    attributes:
      circuit: Living Room
      devices: '{{ [''light.virtual_living_room_light'', ''fan.virtual_ceiling_fan'']
        }}'
      breaker_amps: '15'
  - name: Lab SPAN office Supply
    unique_id: lab_span_office_supply
    device_class: power
    state: '{{ is_state(''switch.span_panel_office_outlets_breaker'', ''on'') and
      is_state(''input_boolean.lab_span_office_fault'', ''off'') and is_state(''input_boolean.lab_span_main_outage'',
      ''off'') and is_state(''binary_sensor.lab_span_bridge_connected'', ''on'') and
      (is_state(''input_boolean.lab_span_grid_outage'', ''off'') or (is_state(''input_boolean.lab_span_grid_outage'',
      ''on'') and is_state(''input_boolean.lab_span_backup_office'', ''on'') and is_state(''binary_sensor.lab_span_backup_ready'',
      ''on'') and states(''sensor.lab_span_backup_reserved_power'') | float(99999)
      <= 10500)) }}'
    attributes:
      circuit: Office Outlets
      devices: '{{ [''switch.virtual_heater'', ''switch.virtual_desk_lamp''] }}'
      breaker_amps: '20'
  - name: Lab SPAN kitchen Supply
    unique_id: lab_span_kitchen_supply
    device_class: power
    state: '{{ is_state(''switch.span_panel_kitchen_outlets_breaker'', ''on'') and
      is_state(''input_boolean.lab_span_kitchen_fault'', ''off'') and is_state(''input_boolean.lab_span_main_outage'',
      ''off'') and is_state(''binary_sensor.lab_span_bridge_connected'', ''on'') and
      (is_state(''input_boolean.lab_span_grid_outage'', ''off'') or (is_state(''input_boolean.lab_span_grid_outage'',
      ''on'') and is_state(''input_boolean.lab_span_backup_kitchen'', ''on'') and
      is_state(''binary_sensor.lab_span_backup_ready'', ''on'') and states(''sensor.lab_span_backup_reserved_power'')
      | float(99999) <= 10500)) }}'
    attributes:
      circuit: Kitchen Outlets
      devices: '{{ [''switch.virtual_refrigerator'', ''switch.virtual_toaster'', ''switch.virtual_dishwasher'']
        }}'
      breaker_amps: '20'
  - name: Lab SPAN essentials Supply
    unique_id: lab_span_essentials_supply
    device_class: power
    state: '{{ is_state(''switch.span_panel_essential_electronics_breaker'', ''on'')
      and is_state(''input_boolean.lab_span_essentials_fault'', ''off'') and is_state(''input_boolean.lab_span_main_outage'',
      ''off'') and is_state(''binary_sensor.lab_span_bridge_connected'', ''on'') and
      (is_state(''input_boolean.lab_span_grid_outage'', ''off'') or (is_state(''input_boolean.lab_span_grid_outage'',
      ''on'') and is_state(''input_boolean.lab_span_backup_essentials'', ''on'') and
      is_state(''binary_sensor.lab_span_backup_ready'', ''on'') and states(''sensor.lab_span_backup_reserved_power'')
      | float(99999) <= 10500)) }}'
    attributes:
      circuit: Essential Electronics
      devices: '{{ [] }}'
      breaker_amps: '15'
  - name: Lab SPAN laundry Supply
    unique_id: lab_span_laundry_supply
    device_class: power
    state: '{{ is_state(''switch.span_panel_laundry_dryer_breaker'', ''on'') and is_state(''input_boolean.lab_span_laundry_fault'',
      ''off'') and is_state(''input_boolean.lab_span_main_outage'', ''off'') and is_state(''binary_sensor.lab_span_bridge_connected'',
      ''on'') and (is_state(''input_boolean.lab_span_grid_outage'', ''off'') or (is_state(''input_boolean.lab_span_grid_outage'',
      ''on'') and is_state(''input_boolean.lab_span_backup_laundry'', ''on'') and
      is_state(''binary_sensor.lab_span_backup_ready'', ''on'') and states(''sensor.lab_span_backup_reserved_power'')
      | float(99999) <= 10500)) }}'
    attributes:
      circuit: Laundry Dryer
      devices: '{{ [''switch.virtual_dryer''] }}'
      breaker_amps: '30'
  - name: Lab SPAN garage Supply
    unique_id: lab_span_garage_supply
    device_class: power
    state: '{{ is_state(''switch.span_panel_garage_ev_charger_breaker'', ''on'') and
      is_state(''input_boolean.lab_span_garage_fault'', ''off'') and is_state(''input_boolean.lab_span_main_outage'',
      ''off'') and is_state(''binary_sensor.lab_span_bridge_connected'', ''on'') and
      (is_state(''input_boolean.lab_span_grid_outage'', ''off'') or (is_state(''input_boolean.lab_span_grid_outage'',
      ''on'') and is_state(''input_boolean.lab_span_backup_garage'', ''on'') and is_state(''binary_sensor.lab_span_backup_ready'',
      ''on'') and states(''sensor.lab_span_backup_reserved_power'') | float(99999)
      <= 10500)) }}'
    attributes:
      circuit: Garage EV Charger
      devices: '{{ [''switch.virtual_ev_charger''] }}'
      breaker_amps: '60'
  - name: Lab SPAN hvac Supply
    unique_id: lab_span_hvac_supply
    device_class: power
    state: '{{ is_state(''switch.span_panel_central_hvac_breaker'', ''on'') and is_state(''input_boolean.lab_span_hvac_fault'',
      ''off'') and is_state(''input_boolean.lab_span_main_outage'', ''off'') and is_state(''binary_sensor.lab_span_bridge_connected'',
      ''on'') and (is_state(''input_boolean.lab_span_grid_outage'', ''off'') or (is_state(''input_boolean.lab_span_grid_outage'',
      ''on'') and is_state(''input_boolean.lab_span_backup_hvac'', ''on'') and is_state(''binary_sensor.lab_span_backup_ready'',
      ''on'') and states(''sensor.lab_span_backup_reserved_power'') | float(99999)
      <= 10500)) }}'
    attributes:
      circuit: Central HVAC
      devices: '{{ [''climate.virtual_room_thermostat''] }}'
      breaker_amps: '30'
  - name: Lab SPAN water_heater Supply
    unique_id: lab_span_water_heater_supply
    device_class: power
    state: '{{ is_state(''switch.span_panel_water_heater_breaker'', ''on'') and is_state(''input_boolean.lab_span_water_heater_fault'',
      ''off'') and is_state(''input_boolean.lab_span_main_outage'', ''off'') and is_state(''binary_sensor.lab_span_bridge_connected'',
      ''on'') and (is_state(''input_boolean.lab_span_grid_outage'', ''off'') or (is_state(''input_boolean.lab_span_grid_outage'',
      ''on'') and is_state(''input_boolean.lab_span_backup_water_heater'', ''on'')
      and is_state(''binary_sensor.lab_span_backup_ready'', ''on'') and states(''sensor.lab_span_backup_reserved_power'')
      | float(99999) <= 10500)) }}'
    attributes:
      circuit: Water Heater
      devices: '{{ [''switch.virtual_water_heater''] }}'
      breaker_amps: '30'
- sensor:
  - name: Lab SPAN living_room Power
    unique_id: lab_span_living_room_power
    device_class: power
    state_class: measurement
    unit_of_measurement: W
    state: '{{ (states(''sensor.virtual_living_room_light_power'') | float(0) + states(''sensor.virtual_ceiling_fan_power'')
      | float(0)) | round(2) }}'
  - name: Lab SPAN office Power
    unique_id: lab_span_office_power
    device_class: power
    state_class: measurement
    unit_of_measurement: W
    state: '{{ (states(''sensor.virtual_heater_power'') | float(0) + states(''sensor.virtual_desk_lamp_power'')
      | float(0)) | round(2) }}'
  - name: Lab SPAN kitchen Power
    unique_id: lab_span_kitchen_power
    device_class: power
    state_class: measurement
    unit_of_measurement: W
    state: '{{ (states(''sensor.virtual_refrigerator_power'') | float(0) + states(''sensor.virtual_toaster_power'')
      | float(0) + states(''sensor.virtual_dishwasher_power'') | float(0)) | round(2)
      }}'
  - name: Lab SPAN essentials Power
    unique_id: lab_span_essentials_power
    device_class: power
    state_class: measurement
    unit_of_measurement: W
    state: '{{ (states(''sensor.virtual_electronics_power'') | float(0)) | round(2)
      }}'
  - name: Lab SPAN laundry Power
    unique_id: lab_span_laundry_power
    device_class: power
    state_class: measurement
    unit_of_measurement: W
    state: '{{ (states(''sensor.virtual_dryer_power'') | float(0)) | round(2) }}'
  - name: Lab SPAN garage Power
    unique_id: lab_span_garage_power
    device_class: power
    state_class: measurement
    unit_of_measurement: W
    state: '{{ (states(''sensor.virtual_ev_charger_power'') | float(0)) | round(2)
      }}'
  - name: Lab SPAN hvac Power
    unique_id: lab_span_hvac_power
    device_class: power
    state_class: measurement
    unit_of_measurement: W
    state: '{{ (states(''sensor.virtual_hvac_power'') | float(0)) | round(2) }}'
  - name: Lab SPAN water_heater Power
    unique_id: lab_span_water_heater_power
    device_class: power
    state_class: measurement
    unit_of_measurement: W
    state: '{{ (states(''sensor.virtual_water_heater_power'') | float(0)) | round(2)
      }}'
  - name: Virtual Electronics Power
    unique_id: lab_electronics_power
    device_class: power
    state_class: measurement
    unit_of_measurement: W
    state: '{% if not is_state(''binary_sensor.lab_span_essentials_supply'', ''on'')
      %}0{% else %}{{ states(''input_number.base_layer_background_watts'') | float(180)
      }}{% endif %}'
  - name: Lab SPAN Backup Reserved Power
    unique_id: lab_span_backup_reserved_power
    unit_of_measurement: W
    device_class: power
    state: '{{ (73 if is_state(''input_boolean.lab_span_backup_living_room'', ''on'')
      else 0) + (1516 if is_state(''input_boolean.lab_span_backup_office'', ''on'')
      else 0) + (2553 if is_state(''input_boolean.lab_span_backup_kitchen'', ''on'')
      else 0) + (500 if is_state(''input_boolean.lab_span_backup_essentials'', ''on'')
      else 0) + (5001 if is_state(''input_boolean.lab_span_backup_laundry'', ''on'')
      else 0) + (5760 if is_state(''input_boolean.lab_span_backup_garage'', ''on'')
      else 0) + (3008 if is_state(''input_boolean.lab_span_backup_hvac'', ''on'')
      else 0) + (4502 if is_state(''input_boolean.lab_span_backup_water_heater'',
      ''on'') else 0) }}'
  - name: Lab SPAN Backup Available Power
    unique_id: lab_span_backup_available_power
    unit_of_measurement: W
    device_class: power
    state: '{{ [0, 10500 - states(''sensor.lab_span_backup_reserved_power'') | float(0)]
      | max }}'
  - name: Lab SPAN Effective EV Current
    unique_id: lab_span_effective_ev_current
    unit_of_measurement: A
    state: '{% set amps = states(''input_number.virtual_ev_current_limit'') | float(32)
      %}{{ [amps, 24] | min if is_state(''input_boolean.lab_span_grid_outage'', ''on'')
      else amps }}'
automation:
- id: lab_span_living_room_interlock
  alias: Lab SPAN living_room power interlock
  mode: restart
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.lab_span_living_room_supply
    - input_boolean.lab_light_on
    - input_boolean.lab_fan_on
    - light.virtual_living_room_light
    - fan.virtual_ceiling_fan
  - trigger: homeassistant
    event: start
  - trigger: time_pattern
    seconds: /10
  conditions:
  - condition: template
    value_template: '{{ not is_state(''binary_sensor.lab_span_living_room_supply'',
      ''on'') }}'
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id:
      - input_boolean.lab_light_on
      - input_boolean.lab_fan_on
- id: lab_span_living_room_fault
  alias: Lab SPAN living_room fault relay
  mode: queued
  triggers:
  - trigger: state
    entity_id:
    - input_boolean.lab_span_living_room_fault
    - input_boolean.lab_span_main_outage
    to:
    - 'on'
    - 'off'
    id: command
  - trigger: state
    entity_id: switch.span_panel_living_room_breaker
    to: 'on'
    id: enforce
  - trigger: time_pattern
    seconds: /10
    id: enforce
  - trigger: homeassistant
    event: start
    id: enforce
  actions:
  - delay:
      seconds: 4
  - choose:
    - conditions: '{{ (is_state(''input_boolean.lab_span_living_room_fault'', ''on'')
        or is_state(''input_boolean.lab_span_main_outage'', ''on'')) and is_state(''switch.span_panel_living_room_breaker'',
        ''on'') }}'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.span_panel_living_room_breaker
    - conditions: '{{ not (is_state(''input_boolean.lab_span_living_room_fault'',
        ''on'') or is_state(''input_boolean.lab_span_main_outage'', ''on'')) and trigger.id
        == ''command'' and is_state(''switch.span_panel_living_room_breaker'', ''off'')
        }}'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.span_panel_living_room_breaker
- id: lab_span_office_interlock
  alias: Lab SPAN office power interlock
  mode: restart
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.lab_span_office_supply
    - input_boolean.heater_enabled
    - input_boolean.lamp_enabled
    - input_boolean.lab_heater_demand
    - switch.virtual_heater
    - switch.virtual_desk_lamp
  - trigger: homeassistant
    event: start
  - trigger: time_pattern
    seconds: /10
  conditions:
  - condition: template
    value_template: '{{ not is_state(''binary_sensor.lab_span_office_supply'', ''on'')
      }}'
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id:
      - input_boolean.heater_enabled
      - input_boolean.lamp_enabled
      - input_boolean.lab_heater_demand
- id: lab_span_office_fault
  alias: Lab SPAN office fault relay
  mode: queued
  triggers:
  - trigger: state
    entity_id:
    - input_boolean.lab_span_office_fault
    - input_boolean.lab_span_main_outage
    to:
    - 'on'
    - 'off'
    id: command
  - trigger: state
    entity_id: switch.span_panel_office_outlets_breaker
    to: 'on'
    id: enforce
  - trigger: time_pattern
    seconds: /10
    id: enforce
  - trigger: homeassistant
    event: start
    id: enforce
  actions:
  - delay:
      seconds: 4
  - choose:
    - conditions: '{{ (is_state(''input_boolean.lab_span_office_fault'', ''on'') or
        is_state(''input_boolean.lab_span_main_outage'', ''on'')) and is_state(''switch.span_panel_office_outlets_breaker'',
        ''on'') }}'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.span_panel_office_outlets_breaker
    - conditions: '{{ not (is_state(''input_boolean.lab_span_office_fault'', ''on'')
        or is_state(''input_boolean.lab_span_main_outage'', ''on'')) and trigger.id
        == ''command'' and is_state(''switch.span_panel_office_outlets_breaker'',
        ''off'') }}'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.span_panel_office_outlets_breaker
- id: lab_span_kitchen_interlock
  alias: Lab SPAN kitchen power interlock
  mode: restart
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.lab_span_kitchen_supply
    - input_boolean.lab_refrigerator_enabled
    - input_boolean.lab_toaster_enabled
    - input_boolean.lab_dishwasher_enabled
    - switch.virtual_refrigerator
    - switch.virtual_toaster
    - switch.virtual_dishwasher
  - trigger: homeassistant
    event: start
  - trigger: time_pattern
    seconds: /10
  conditions:
  - condition: template
    value_template: '{{ not is_state(''binary_sensor.lab_span_kitchen_supply'', ''on'')
      }}'
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id:
      - input_boolean.lab_refrigerator_enabled
      - input_boolean.lab_toaster_enabled
      - input_boolean.lab_dishwasher_enabled
- id: lab_span_kitchen_fault
  alias: Lab SPAN kitchen fault relay
  mode: queued
  triggers:
  - trigger: state
    entity_id:
    - input_boolean.lab_span_kitchen_fault

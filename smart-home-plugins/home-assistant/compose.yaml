name: basehack-energy-lab
services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.9.3
    container_name: basehack-homeassistant
    ports:
      - "127.0.0.1:8123:8123"
    environment:
      TZ: America/Chicago
    volumes:
      - ./config:/config
    restart: unless-stopped

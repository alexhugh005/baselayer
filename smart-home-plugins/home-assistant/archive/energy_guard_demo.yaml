input_number:
  heater_test_energy:
    name: Heater test energy offset
    min: 0
    max: 10
    step: 0.01
    initial: 0
    unit_of_measurement: kWh
template:
  - sensor:
      - name: Virtual Heater Guard Energy
        unique_id: virtual_heater_guard_energy
        device_class: energy
        unit_of_measurement: kWh
        availability: "{{ is_number(states('sensor.virtual_heater_energy')) }}"
        state: "{{ (states('sensor.virtual_heater_energy') | float(0) + states('input_number.heater_test_energy') | float(0)) | round(5) }}"
script:
  energy_guard_test:
    alias: Test 1 kWh shutoff
    mode: single
    sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.demo_auto_shutoff
      - action: switch.turn_off
        target:
          entity_id: switch.virtual_heater
      - action: input_number.set_value
        target:
          entity_id: input_number.heater_test_energy
        data:
          value: 0
      - delay:
          seconds: 1
      - action: switch.turn_on
        target:
          entity_id: switch.virtual_heater
      - delay:
          seconds: 2
      - action: input_number.set_value
        target:
          entity_id: input_number.heater_test_energy
        data:
          value: 1.01

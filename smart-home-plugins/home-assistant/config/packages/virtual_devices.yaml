input_boolean:
  heater_enabled:
    name: Virtual Heater power state
    initial: true
  dryer_enabled:
    name: Virtual Dryer power state
    initial: true
  lamp_enabled:
    name: Virtual Desk Lamp power state
    initial: true
  demo_auto_shutoff:
    name: Enable heater auto shutoff
    initial: false
input_number:
  heater_watts:
    name: Virtual Heater simulated draw
    min: 0
    max: 2500
    step: 1
    initial: 1500
    unit_of_measurement: W
    mode: slider
  dryer_watts:
    name: Virtual Dryer simulated draw
    min: 0
    max: 5000
    step: 1
    initial: 2400
    unit_of_measurement: W
    mode: slider
  lamp_watts:
    name: Virtual Desk Lamp simulated draw
    min: 0
    max: 100
    step: 1
    initial: 12
    unit_of_measurement: W
    mode: slider
  heater_limit:
    name: Heater power limit
    min: 100
    max: 2500
    step: 50
    initial: 1800
    unit_of_measurement: W
template:
  - switch:
      - name: Virtual Heater
        unique_id: energy_lab_heater_switch
        icon: mdi:radiator
        state: "{{ is_state('input_boolean.heater_enabled', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.heater_enabled
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.heater_enabled
      - name: Virtual Dryer
        unique_id: energy_lab_dryer_switch
        icon: mdi:tumble-dryer
        state: "{{ is_state('input_boolean.dryer_enabled', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.dryer_enabled
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.dryer_enabled
      - name: Virtual Desk Lamp
        unique_id: energy_lab_lamp_switch
        icon: mdi:desk-lamp
        state: "{{ is_state('input_boolean.lamp_enabled', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.lamp_enabled
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.lamp_enabled
  - sensor:
      - name: Virtual Heater Power
        unique_id: energy_lab_heater_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: "{{ states('input_number.heater_watts') | float(0) if is_state('input_boolean.heater_enabled', 'on') else 0 }}"
      - name: Virtual Dryer Power
        unique_id: energy_lab_dryer_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: "{{ states('input_number.dryer_watts') | float(0) if is_state('input_boolean.dryer_enabled', 'on') else 0 }}"
      - name: Virtual Desk Lamp Power
        unique_id: energy_lab_lamp_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: "{{ states('input_number.lamp_watts') | float(0) if is_state('input_boolean.lamp_enabled', 'on') else 0 }}"
sensor:
  - platform: integration
    source: sensor.virtual_heater_power
    name: Virtual Heater Energy
    unique_id: energy_lab_heater_energy
    unit_prefix: k
    unit_time: h
    method: left
    round: 5
    max_sub_interval:
      seconds: 30
  - platform: integration
    source: sensor.virtual_dryer_power
    name: Virtual Dryer Energy
    unique_id: energy_lab_dryer_energy
    unit_prefix: k
    unit_time: h
    method: left
    round: 5
    max_sub_interval:
      seconds: 30
  - platform: integration
    source: sensor.virtual_desk_lamp_power
    name: Virtual Desk Lamp Energy
    unique_id: energy_lab_lamp_energy
    unit_prefix: k
    unit_time: h
    method: left
    round: 5
    max_sub_interval:
      seconds: 30
automation:
  - id: energy_lab_heater_shutoff
    alias: "Lab: sustained heater usage shutoff"
    mode: single
    triggers:
      - trigger: template
        value_template: >-
          {{ is_state('input_boolean.demo_auto_shutoff', 'on') and
             states('sensor.virtual_heater_power') | float(0) >
             states('input_number.heater_limit') | float(1800) }}
        for:
          seconds: 15
    actions:
      - action: switch.turn_off
        target:
          entity_id: switch.virtual_heater
      - action: persistent_notification.create
        data:
          title: "Energy Lab: heater switched off"
          message: "The virtual heater exceeded its configured power limit for 15 seconds. Toggle it on manually when ready to test again."
          notification_id: energy_lab_shutoff
script:
  lab_reset:
    alias: Reset virtual devices
    sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.demo_auto_shutoff
      - action: input_boolean.turn_on
        target:
          entity_id:
            - input_boolean.heater_enabled
            - input_boolean.dryer_enabled
            - input_boolean.lamp_enabled
      - action: input_number.set_value
        target:
          entity_id: input_number.heater_watts
        data:
          value: 1500
      - action: input_number.set_value
        target:
          entity_id: input_number.dryer_watts
        data:
          value: 2400
      - action: input_number.set_value
        target:
          entity_id: input_number.lamp_watts
        data:
          value: 12
      - action: input_number.set_value
        target:
          entity_id: input_number.heater_limit
        data:
          value: 1800
      - action: persistent_notification.dismiss
        data:
          notification_id: energy_lab_shutoff

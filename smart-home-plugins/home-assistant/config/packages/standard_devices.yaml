# Virtual standard entity types for testing integrations without hardware.
input_number:
  lab_light_brightness:
    name: Light brightness backing value
    min: 0
    max: 255
    step: 1
    initial: 180
  lab_room_temperature:
    name: Simulated room temperature
    min: 10
    max: 35
    step: 0.5
    initial: 20
    unit_of_measurement: °C
input_boolean:
  lab_light_on:
    name: Light backing switch
    initial: true
  lab_fan_on:
    name: Fan backing switch
    initial: false
  lab_hvac_on:
    name: Virtual HVAC relay
    initial: false
template:
  - light:
      - name: Virtual Living Room Light
        unique_id: lab_living_room_light
        state: "{{ is_state('input_boolean.lab_light_on', 'on') }}"
        level: "{{ states('input_number.lab_light_brightness') | int(0) }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.lab_light_on
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.lab_light_on
        set_level:
          - action: input_number.set_value
            target:
              entity_id: input_number.lab_light_brightness
            data:
              value: "{{ brightness }}"
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.lab_light_on
  - fan:
      - name: Virtual Ceiling Fan
        unique_id: lab_ceiling_fan
        state: "{{ is_state('input_boolean.lab_fan_on', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.lab_fan_on
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.lab_fan_on
  - sensor:
      - name: Virtual Room Temperature
        unique_id: lab_room_temperature
        device_class: temperature
        state_class: measurement
        unit_of_measurement: °C
        state: "{{ states('input_number.lab_room_temperature') }}"
      - name: Virtual Living Room Light Power
        unique_id: lab_light_power
        device_class: power
        state_class: measurement
        unit_of_measurement: W
        state: "{{ (12 * states('input_number.lab_light_brightness') | float(0) / 255) | round(2) if is_state('input_boolean.lab_light_on', 'on') else 0 }}"
      - name: Virtual Ceiling Fan Power
        unique_id: lab_fan_power
        device_class: power
        state_class: measurement
        unit_of_measurement: W
        state: "{{ 60 if is_state('input_boolean.lab_fan_on', 'on') else 0 }}"
      - name: Virtual HVAC Power
        unique_id: lab_hvac_power
        device_class: power
        state_class: measurement
        unit_of_measurement: W
        state: "{{ 2000 if is_state('input_boolean.lab_hvac_on', 'on') else 0 }}"
climate:
  - platform: generic_thermostat
    name: Virtual Room Thermostat
    unique_id: lab_room_thermostat
    heater: input_boolean.lab_hvac_on
    target_sensor: sensor.virtual_room_temperature
    min_temp: 15
    max_temp: 30
    target_temp: 22
    initial_hvac_mode: 'off'
    cold_tolerance: 0.3
    hot_tolerance: 0.3
    precision: 0.5

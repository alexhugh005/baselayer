input_number:
  base_layer_background_watts:
    name: Other household load
    min: 0
    max: 15000
    step: 100
    initial: 1000
    unit_of_measurement: W
template:
  - sensor:
      - name: Virtual Household Power
        unique_id: base_layer_household_power
        device_class: power
        state_class: measurement
        unit_of_measurement: W
        availability: "{{ is_number(states('sensor.virtual_heater_power')) and is_number(states('sensor.virtual_dryer_power')) and is_number(states('sensor.virtual_desk_lamp_power')) and is_number(states('sensor.virtual_living_room_light_power')) and is_number(states('sensor.virtual_ceiling_fan_power')) and is_number(states('sensor.virtual_hvac_power')) and is_number(states('input_number.base_layer_background_watts')) }}"
        state: "{{ (states('sensor.virtual_heater_power') | float(0) + states('sensor.virtual_dryer_power') | float(0) + states('sensor.virtual_desk_lamp_power') | float(0) + states('sensor.virtual_living_room_light_power') | float(0) + states('sensor.virtual_ceiling_fan_power') | float(0) + states('sensor.virtual_hvac_power') | float(0) + states('input_number.base_layer_background_watts') | float(0)) | round(2) }}"
script:
  base_layer_overload:
    alias: Test Base Layer overload
    mode: single
    sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.base_layer_background_watts
        data:
          value: 0
      - action: script.lab_reset
      - action: input_number.set_value
        target:
          entity_id: input_number.heater_watts
        data:
          value: 2500
      - action: input_number.set_value
        target:
          entity_id: input_number.dryer_watts
        data:
          value: 5000
      - delay:
          seconds: 2
      - action: input_number.set_value
        target:
          entity_id: input_number.base_layer_background_watts
        data:
          value: 10000
  base_layer_reset:
    alias: Reset Base Layer demo
    sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.base_layer_background_watts
        data:
          value: 1000
      - action: script.lab_reset

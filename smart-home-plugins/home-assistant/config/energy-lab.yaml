title: Energy Test Lab
views:
  - title: Virtual Devices
    path: devices
    icon: mdi:home-lightning-bolt
    cards:
      - type: markdown
        content: |
          # Base Layer energy lab
          These appliances are simulated. Adjust their watts and toggle their switches. Off means **0 W**; energy accumulates while on.
          **Try Base Layer:** run Test overload below to watch devices switch off in order of current power usage.
      - type: gauge
        entity: sensor.base_layer_household_power
        name: Base Layer — household kW
        min: 0
        max: 20
        severity:
          green: 0
          yellow: 9
          red: 11
      - type: entities
        title: Base Layer
        show_header_toggle: false
        entities:
          - entity: sensor.base_layer_household_power
            name: Household power (11 kW limit)
          - type: attribute
            entity: sensor.base_layer_household_power
            attribute: status
            name: Status
          - entity: input_number.base_layer_background_watts
            name: Other household watts
          - entity: script.base_layer_overload
            name: Test overload
          - entity: script.base_layer_reset
            name: Reset demo
      - type: markdown
        content: |
          **Base Layer** keeps live household load below **11 kW**. It turns off the highest-drawing eligible device, checks the updated total, and repeats if needed.
          **Test overload** adds a simulated 10 kW background load: the 5 kW dryer turns off first, then the 2.5 kW heater. Devices stay off until manually restarted. Other loads are measured but are not eligible for shutoff.
      - type: entities
        title: Virtual Heater
        show_header_toggle: false
        entities:
          - entity: switch.virtual_heater
            name: Power switch
          - entity: input_number.heater_watts
            name: Simulated watts
          - entity: sensor.virtual_heater_power
            name: Current power
          - entity: sensor.virtual_heater_energy
            name: Energy used
      - type: entities
        title: Virtual Dryer
        show_header_toggle: false
        entities:
          - entity: switch.virtual_dryer
            name: Power switch
          - entity: input_number.dryer_watts
            name: Simulated watts
          - entity: sensor.virtual_dryer_power
            name: Current power
          - entity: sensor.virtual_dryer_energy
            name: Energy used
      - type: entities
        title: Virtual Desk Lamp
        show_header_toggle: false
        entities:
          - entity: switch.virtual_desk_lamp
            name: Power switch
          - entity: input_number.lamp_watts
            name: Simulated watts
          - entity: sensor.virtual_desk_lamp_power
            name: Current power
          - entity: sensor.virtual_desk_lamp_energy
            name: Energy used
      - type: history-graph
        title: Power usage over time
        hours_to_show: 1
        entities:
          - sensor.virtual_heater_power
          - sensor.virtual_dryer_power
          - sensor.virtual_desk_lamp_power

  - title: Standard Devices
    path: standard
    icon: mdi:devices
    cards:
      - type: markdown
        content: |
          # Standard virtual devices
          These use Home Assistant's normal light, fan, and climate controls.
          Enable **Heat** on the thermostat, then lower the room temperature below the target to simulate heating. Raise it above the target to stop heating. Temperature is manually simulated.
      - type: light
        entity: light.virtual_living_room_light
        name: Living room light
      - type: entities
        title: Ceiling fan
        entities:
          - fan.virtual_ceiling_fan
          - sensor.virtual_ceiling_fan_power
      - type: thermostat
        entity: climate.virtual_room_thermostat
        name: Room thermostat
      - type: entities
        title: Temperature and power
        show_header_toggle: false
        entities:
          - input_number.lab_room_temperature
          - sensor.virtual_room_temperature
          - sensor.virtual_hvac_power
          - sensor.virtual_living_room_light_power

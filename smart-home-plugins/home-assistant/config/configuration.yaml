homeassistant:
  name: Energy Test Lab
  latitude: 0
  longitude: 0
  elevation: 0
  unit_system: metric
  time_zone: America/Chicago
  packages: !include_dir_named packages
# Deliberately enable only local lab features, without device discovery.
frontend:
history:
logbook:
recorder:
  purge_keep_days: 7
config:
energy:
my:
api:
http:
lovelace:
  mode: yaml
  dashboards:
    energy-lab:
      mode: yaml
      title: Energy Lab
      icon: mdi:lightning-bolt
      show_in_sidebar: true
      filename: energy-lab.yaml

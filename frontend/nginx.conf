server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Resolve the service again after container replacement.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8080;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $http_host;
    }

    location = /health {
        proxy_pass $api;
        proxy_set_header Host $http_host;
    }

    # React routes and the Home Assistant OAuth callback use the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
